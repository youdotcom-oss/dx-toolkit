name: Sync Remote MCP Surface

on:
  repository_dispatch:
    types:
      - sync-remote-mcp-surface

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit_changes.outputs.commit_sha }}
      should_publish: ${{ steps.detect_changes.outputs.should_publish }}
    steps:
      - name: Validate dispatch payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$CLIENT_PAYLOAD" > "$RUNNER_TEMP/client-payload.json"

          if ! jq -e '.surfaceVersion | strings' "$RUNNER_TEMP/client-payload.json" >/dev/null; then
            echo "::error::client_payload.surfaceVersion must be a string"
            exit 1
          fi

          if ! jq -e '.bump | strings | select(. == "patch" or . == "minor" or . == "major")' "$RUNNER_TEMP/client-payload.json" >/dev/null; then
            echo "::error::client_payload.bump must be patch, minor, or major"
            exit 1
          fi

          if ! jq -e '.tools | arrays and length > 0' "$RUNNER_TEMP/client-payload.json" >/dev/null; then
            echo "::error::client_payload.tools must be a non-empty array"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Rewrite generated CLI tool contract
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$CLIENT_PAYLOAD" > "$RUNNER_TEMP/client-payload.json"
          bun scripts/update-cli-tools.ts "$RUNNER_TEMP/client-payload.json"

      - name: Validate lockstep package versions
        run: |
          CLI_VERSION=$(jq -r '.version' packages/cli/package.json)
          MCP_VERSION=$(jq -r '.version' packages/mcp/package.json)

          if [[ "$CLI_VERSION" != "$MCP_VERSION" ]]; then
            echo "::error::packages/cli and packages/mcp must stay on the same version for remote-surface releases"
            echo "::error::cli=$CLI_VERSION mcp=$MCP_VERSION"
            exit 1
          fi

      - name: Validate repo
        env:
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bun test
          bun run check

      - name: Detect generated contract changes
        id: detect_changes
        run: |
          git add packages/cli/src/tools.ts

          if git diff --staged --quiet; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated contract
        id: commit_changes
        if: steps.detect_changes.outputs.should_publish == 'true'
        env:
          SURFACE_VERSION: ${{ github.event.client_payload.surfaceVersion }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(cli): sync remote MCP surface ${SURFACE_VERSION} [skip ci]"
          git push origin HEAD:main
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dispatch-publish-cli:
    if: needs.sync.outputs.should_publish == 'true'
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-cli workflow
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          BUMP: ${{ github.event.client_payload.bump }}
          COMMIT_SHA: ${{ needs.sync.outputs.commit_sha }}
          PRERELEASE: ${{ github.event.client_payload.prerelease }}
        run: |
          if [[ -z "$COMMIT_SHA" ]]; then
            echo "::error::Missing committed main SHA for publish-cli dispatch"
            exit 1
          fi

          DISPATCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ -n "$PRERELEASE" ]]; then
            gh api repos/${{ github.repository }}/actions/workflows/publish-cli.yml/dispatches \
              --method POST \
              -f ref=main \
              -f inputs[bump]="$BUMP" \
              -f inputs[prerelease]="$PRERELEASE"
          else
            gh api repos/${{ github.repository }}/actions/workflows/publish-cli.yml/dispatches \
              --method POST \
              -f ref=main \
              -f inputs[bump]="$BUMP"
          fi

          RUN_ID=""
          for _ in $(seq 1 24); do
            RUN_ID=$(
              gh run list \
                --workflow publish-cli.yml \
                --branch main \
                --event workflow_dispatch \
                --json databaseId,createdAt,headSha \
                --limit 20 \
                | jq -r --arg sha "$COMMIT_SHA" --arg dispatched "$DISPATCHED_AT" '
                    map(select(.headSha == $sha and .createdAt >= $dispatched))
                    | sort_by(.createdAt)
                    | last
                    | .databaseId // empty
                  '
            )

            if [[ -n "$RUN_ID" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Timed out waiting for publish-cli workflow run to appear"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status

  dispatch-publish-mcp:
    if: needs.sync.outputs.should_publish == 'true'
    needs: dispatch-publish-cli
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish-mcp workflow
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          BUMP: ${{ github.event.client_payload.bump }}
          COMMIT_SHA: ${{ needs.sync.outputs.commit_sha }}
          PRERELEASE: ${{ github.event.client_payload.prerelease }}
        run: |
          if [[ -z "$COMMIT_SHA" ]]; then
            echo "::error::Missing committed main SHA for publish-mcp dispatch"
            exit 1
          fi

          DISPATCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ -n "$PRERELEASE" ]]; then
            gh api repos/${{ github.repository }}/actions/workflows/publish-mcp.yml/dispatches \
              --method POST \
              -f ref=main \
              -f inputs[bump]="$BUMP" \
              -f inputs[prerelease]="$PRERELEASE"
          else
            gh api repos/${{ github.repository }}/actions/workflows/publish-mcp.yml/dispatches \
              --method POST \
              -f ref=main \
              -f inputs[bump]="$BUMP"
          fi

          RUN_ID=""
          for _ in $(seq 1 24); do
            RUN_ID=$(
              gh run list \
                --workflow publish-mcp.yml \
                --branch main \
                --event workflow_dispatch \
                --json databaseId,createdAt,headSha \
                --limit 20 \
                | jq -r --arg sha "$COMMIT_SHA" --arg dispatched "$DISPATCHED_AT" '
                    map(select(.headSha == $sha and .createdAt >= $dispatched))
                    | sort_by(.createdAt)
                    | last
                    | .databaseId // empty
                  '
            )

            if [[ -n "$RUN_ID" ]]; then
              break
            fi

            sleep 5
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Timed out waiting for publish-mcp workflow run to appear"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
