name: Weekly Performance Monitoring

on:
  schedule:
    - cron: '0 13 * * 1' # 1pm UTC every Monday
  workflow_dispatch: # Allow manual triggers

jobs:
  monitor-performance:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For pushing commits
      issues: write # For creating/updating issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Download previous failure count
        id: previous_count
        uses: actions/download-artifact@v4
        with:
          name: performance-failure-count
          path: .
        continue-on-error: true

      - name: Run performance measurements
        id: perf_tests
        run: |
          echo "Starting performance measurements..."
          bun scripts/performance/measure.ts > results.json
          echo "Performance measurements completed"
          cat results.json | head -20
        env:
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
        continue-on-error: true

      - name: Track failures and create issue if needed
        if: steps.perf_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read previous failure count (default to 0)
          FAILURE_COUNT=0
          if [ -f failure_count.txt ]; then
            FAILURE_COUNT=$(cat failure_count.txt)
          fi

          # Increment failure count
          FAILURE_COUNT=$((FAILURE_COUNT + 1))
          echo $FAILURE_COUNT > failure_count.txt
          echo "Current failure count: $FAILURE_COUNT"

          # Create issue after 3 consecutive failures
          if [ $FAILURE_COUNT -ge 3 ]; then
            echo "Creating GitHub issue for performance monitoring failures..."

            # Check if issue already exists
            EXISTING_ISSUE=$(gh issue list --label "performance,automated-issue" --state open --json number --jq '.[0].number')

            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create \
                --title "Performance Monitoring Failing: Investigation Needed" \
                --label "performance,automated-issue" \
                --body "## Performance Monitoring Failures

          Performance monitoring has failed for **$FAILURE_COUNT consecutive weeks**.

          ### Troubleshooting Steps

          1. **Run locally to diagnose:**
          \`\`\`bash
          export YDC_API_KEY=your-key
          bun scripts/performance/measure.ts > results.json
          \`\`\`

          2. **Check for common issues:**
          - API key permissions (needs search, contents, express access)
          - Rate limiting (429 errors)
          - API endpoint changes
          - Build failures in packages/api

          3. **Review measurement script:**
          - Check \`scripts/performance/measure.ts\`
          - Verify API package builds correctly
          - Look for timeout issues

          4. **Check workflow logs:**
          - View recent workflow runs: https://github.com/youdotcom-oss/dx-toolkit/actions/workflows/weekly-performance.yml

          ### Action Required
          1. Investigate the root cause using steps above
          2. Fix the measurement script or API package issues
          3. Test locally before pushing fix
          4. Close this issue once monitoring is restored

          ---
          *This issue was automatically created after $FAILURE_COUNT consecutive failures.*"

              echo "Issue created successfully"
            else
              echo "Issue already exists: #$EXISTING_ISSUE"
            fi
          fi

      - name: Reset failure count on success
        if: steps.perf_tests.outcome == 'success'
        run: |
          echo "0" > failure_count.txt
          echo "Performance monitoring passed - resetting failure count"

      - name: Upload failure count artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-failure-count
          path: failure_count.txt
          retention-days: 90

      - name: Detect regressions and file issues
        if: steps.perf_tests.outcome == 'success'
        run: bun scripts/performance/detect-and-file.ts results.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update documentation
        if: steps.perf_tests.outcome == 'success'
        run: bun scripts/performance/update-docs.ts results.json

      - name: Commit and push changes
        if: steps.perf_tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/PERFORMANCE.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(performance): update weekly measurements [skip ci]"
            git push
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: results.json
          retention-days: 90
        continue-on-error: true

      - name: Fail job if measurements failed
        if: steps.perf_tests.outcome == 'failure'
        run: |
          echo "Performance measurements failed. See logs above for details."
          exit 1
