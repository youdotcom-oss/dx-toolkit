name: Weekly Performance Monitoring

on:
  schedule:
    - cron: '0 13 * * 1' # 1pm UTC every Monday
  workflow_dispatch: # Allow manual triggers

jobs:
  monitor-performance:
    runs-on: ubuntu-latest
    permissions:
      contents: write # For pushing commits
      issues: write # For creating/updating issues

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bun run build

      - name: Run performance measurements
        id: perf_tests
        run: |
          echo "Starting performance measurements..."
          bun scripts/performance/measure.ts > results.json
          echo "Performance measurements completed"
          cat results.json | head -20
        env:
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
        continue-on-error: true

      - name: Create issue on failure
        if: steps.perf_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --label "performance,automated-issue" --state open --json number --jq '.[0].number')

          if [ -z "$EXISTING_ISSUE" ]; then
            echo "Creating GitHub issue for performance monitoring failure..."
            gh issue create \
              --title "Performance monitoring failing: investigation needed" \
              --label "performance,automated-issue" \
              --body "## Performance Monitoring Failure

          The weekly performance monitoring workflow failed.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Troubleshooting

          1. **Run locally to diagnose:**
          \`\`\`bash
          source .env
          bun scripts/performance/measure.ts > results.json
          \`\`\`

          2. **Common causes:**
          - Broken import in \`scripts/performance/measure.ts\`
          - API key permissions (needs search, contents, express access)
          - Rate limiting (429 errors)
          - Build failures

          3. **Workflow logs:**
          ${{ github.server_url }}/${{ github.repository }}/actions/workflows/weekly-performance.yml

          ---
          *Automatically created by the weekly performance workflow.*"
          else
            echo "Issue already open: #$EXISTING_ISSUE"
          fi

      - name: Close issue on success
        if: steps.perf_tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ISSUE=$(gh issue list --label "performance,automated-issue" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Closing issue #$EXISTING_ISSUE — performance monitoring restored"
            gh issue close "$EXISTING_ISSUE" --comment "Performance monitoring is passing again. Closing automatically."
          fi

      - name: Detect regressions and file issues
        if: steps.perf_tests.outcome == 'success'
        run: bun scripts/performance/detect-and-file.ts results.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update documentation
        if: steps.perf_tests.outcome == 'success'
        run: bun scripts/performance/update-docs.ts results.json

      - name: Commit and push changes
        if: steps.perf_tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/PERFORMANCE.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(performance): update weekly measurements [skip ci]"
            git push
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ github.run_number }}
          path: results.json
          retention-days: 90
        continue-on-error: true

      - name: Fail job if measurements failed
        if: steps.perf_tests.outcome == 'failure'
        run: |
          echo "Performance measurements failed. See logs above for details."
          exit 1
