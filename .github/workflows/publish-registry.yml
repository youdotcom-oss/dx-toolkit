name: "Publish to MCP Registry"

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Bump server.json version (patch)
        run: |
          cd packages/mcp
          CURRENT=$(jq -r '.version' server.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          jq --arg v "$NEXT" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "Bumped server.json: $CURRENT → $NEXT"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Authenticate with MCP Registry
        run: |
          cd packages/mcp
          mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          cd packages/mcp
          mcp-publisher publish

      - name: Commit and push server.json version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/mcp/server.json
          git commit -m "chore(mcp): update server.json to v${VERSION} [skip ci]

          Automated version bump for Anthropic MCP Registry publishing.

          Generated by GitHub Actions"
          git push origin HEAD:main
