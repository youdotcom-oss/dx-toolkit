name: "Package: publish @youdotcom-oss/cli"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Prerelease number (optional, creates x.y.z-next.N)"
        required: false

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  publish:
    uses: ./.github/workflows/_publish-package.yml
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    with:
      npm_package_name: "@youdotcom-oss/cli"
      bump: ${{ github.event.inputs.bump }}
      prerelease: ${{ github.event.inputs.prerelease }}
