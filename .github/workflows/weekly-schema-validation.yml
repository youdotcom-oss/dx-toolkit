name: Weekly Schema Validation

on:
  schedule:
    - cron: '0 14 * * 1' # 2pm UTC every Monday
  workflow_dispatch: # Allow manual triggers

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: packages/api

      - name: Run schema validation tests
        id: schema_tests
        run: |
          bun test src/*/tests/*.schema-validation.spec.ts
        working-directory: packages/api
        continue-on-error: true

      - name: Download previous failure count
        id: previous_count
        uses: actions/download-artifact@v4
        with:
          name: schema-validation-failure-count
          path: .
        continue-on-error: true

      - name: Track failures and create issue if needed
        if: steps.schema_tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read previous failure count (default to 0)
          FAILURE_COUNT=0
          if [ -f failure_count.txt ]; then
            FAILURE_COUNT=$(cat failure_count.txt)
          fi

          # Increment failure count
          FAILURE_COUNT=$((FAILURE_COUNT + 1))
          echo $FAILURE_COUNT > failure_count.txt
          echo "Current failure count: $FAILURE_COUNT"

          # Create issue after 3 consecutive failures
          if [ $FAILURE_COUNT -ge 3 ]; then
            echo "Creating GitHub issue for schema drift..."

            # Check if issue already exists
            EXISTING_ISSUE=$(gh issue list --label "api-schema,automated-issue" --state open --json number --jq '.[0].number')

            if [ -z "$EXISTING_ISSUE" ]; then
              gh issue create \
                --title "Schema Drift Detected: API specs don't match implementation" \
                --label "api-schema,automated-issue" \
                --body "## Schema Validation Failures

          Schema validation tests have failed for **$FAILURE_COUNT consecutive weeks**.

          This indicates that the API package schemas may have drifted from the official You.com OpenAPI specifications.

          ### Affected Tests
          Run the following command to see which tests are failing:
          \`\`\`bash
          cd packages/api
          bun test src/*/tests/*.schema-validation.spec.ts
          \`\`\`

          ### OpenAPI Specifications
          - Search API: https://you.com/specs/openapi_search_v1.yaml
          - Contents API: https://you.com/specs/openapi_contents.yaml
          - Deep-Search API: https://docs.you.com/api-reference/deep-search/v1-deep_search.md

          ### Schema Files to Check
          - \`packages/api/src/search/search.schemas.ts\`
          - \`packages/api/src/contents/contents.schemas.ts\`
          - \`packages/api/src/deep-search/deep-search.schemas.ts\`

          ### Action Required
          1. Review the OpenAPI specs linked above
          2. Update the Zod schemas to match the latest API specifications
          3. Run \`bun test\` to verify all tests pass
          4. Close this issue once schema alignment is restored

          ---
          *This issue was automatically created by the weekly schema validation workflow after $FAILURE_COUNT consecutive failures.*"

              echo "Issue created successfully"
            else
              echo "Issue already exists: #$EXISTING_ISSUE"
            fi
          fi

      - name: Reset failure count on success
        if: steps.schema_tests.outcome == 'success'
        run: |
          echo "0" > failure_count.txt
          echo "Schema validation passed - resetting failure count"

      - name: Upload failure count artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-failure-count
          path: failure_count.txt
          retention-days: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-results-${{ github.run_number }}
          path: packages/api/test-results/
          retention-days: 90
        continue-on-error: true

      - name: Fail job if tests failed
        if: steps.schema_tests.outcome == 'failure'
        run: exit 1
