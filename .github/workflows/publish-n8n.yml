# Custom publish workflow for n8n-nodes-youdotcom
# NOTE: This package uses a custom workflow because n8n community nodes REQUIRE
# the `n8n-nodes-*` naming convention for npm discovery. This differs from the
# monorepo's standard `@youdotcom-oss/*` naming convention.

name: "Package: publish n8n-nodes-youdotcom"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version tag (e.g., 0.1.0)"
        required: true
      next:
        description: "Next prerelease number (optional, e.g., 1 for 0.1.0-next.1)"
        required: false

permissions:
  contents: write
  id-token: write

env:
  PACKAGE_DIR: packages/n8n-nodes-youdotcom
  NPM_PACKAGE_NAME: n8n-nodes-youdotcom

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Inputs
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      is_prerelease: ${{ steps.set_version.outputs.is_prerelease }}
    steps:
      - name: Validate version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Validate version format (semver)
          if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $INPUT_VERSION"
            echo "::error::Expected: X.Y.Z (e.g., 0.1.0, 1.0.0)"
            exit 1
          fi

          # Check for 'v' prefix (common mistake)
          if [[ "$INPUT_VERSION" =~ ^v ]]; then
            echo "::error::Version should not include 'v' prefix"
            echo "::error::Enter '0.1.0' not 'v0.1.0'"
            exit 1
          fi

          echo "✅ Version format validated: $INPUT_VERSION"

      - name: Set version
        id: set_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NEXT: ${{ inputs.next }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          base_version="$INPUT_VERSION"
          next="$INPUT_NEXT"
          branch="$BRANCH_NAME"

          # Auto-treat as prerelease if not on main branch
          if [[ "$branch" != "main" ]]; then
            echo "⚠️  Non-main branch detected: $branch"
            echo "⚠️  Automatically treating as prerelease"

            if [[ -n "$next" ]]; then
              echo "version=${base_version}-next.${next}" >> $GITHUB_OUTPUT
            else
              # Default to next.1 for non-main branches
              echo "version=${base_version}-next.1" >> $GITHUB_OUTPUT
            fi
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            # Main branch - honor next input
            if [[ -n "$next" ]]; then
              echo "version=${base_version}-next.${next}" >> $GITHUB_OUTPUT
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "version=${base_version}" >> $GITHUB_OUTPUT
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

  update-version:
    runs-on: ubuntu-latest
    name: Update Version
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update package.json version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          cd "$PACKAGE_DIR"

          # Update the package version using jq
          jq --arg ver "$VERSION" '.version = $ver' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json version to $VERSION"

          cd ../..

          # Update lock file
          echo "Updating bun.lock..."
          rm -rf bun.lock node_modules
          bun install
          echo "✅ Lock file updated"

          # Commit version change
          git add "$PACKAGE_DIR/package.json" bun.lock

          if git diff --staged --quiet; then
            echo "::notice::No version changes to commit (already at v$VERSION)"
          else
            git commit -m "ci: publish n8n-nodes-youdotcom v$VERSION [skip ci]"
            git push origin "$BRANCH_NAME"
          fi

  npm-publish:
    runs-on: ubuntu-latest
    name: Publish to NPM
    needs: [validate, update-version]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js (for NPM OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: https://registry.npmjs.org
          check-latest: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bun run build

      - name: Publish to NPM (Trusted Publishing)
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Publishing as next (prerelease)"
            npm publish --access public --tag next
          else
            echo "Publishing as latest (stable)"
            npm publish --access public
          fi

  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [validate, npm-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
        run: |
          TAG="n8n-nodes-youdotcom@v${VERSION}"
          TITLE="n8n-nodes-youdotcom v${VERSION}"

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes
          fi

          echo "✅ Created release: ${TAG}"
